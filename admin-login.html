<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Admin Login - Friendship KeyChain</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0d0d10" />
<link rel="stylesheet" href="assets/site.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&family=Permanent+Marker&display=swap" />
<style>
.auth-wrap{max-width:440px;margin:8vh auto;padding:24px 16px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px;box-shadow:6px 6px 0 #000}
.auth-card h1{font:400 clamp(38px,9vw,56px)/.95 var(--display);margin:0 0 8px;text-shadow:3px 3px 0 var(--red)}
.auth-card>p{color:var(--muted);margin:0 0 22px}
.auth-card .field{margin-bottom:16px}
.auth-card .field input{width:100%;padding:12px;border-radius:6px;border:1.5px solid var(--line);background:var(--field);color:var(--paper);font:16px Inter, sans-serif}
.auth-card .field input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(225,29,46,.25)}
.auth-card .btn{width:100%}
.auth-message{padding:10px 12px;border:1px solid #8e3039;background:#2a1216;color:#ffd9dc;border-radius:6px;margin:0 0 14px;font-size:13px}
.auth-message[hidden]{display:none}
.auth-message[data-type="success"]{border-color:#276749;background:#10251d;color:#c6f6d5}
.back-link{display:inline-block;margin-top:18px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main class="auth-wrap">
  <section class="auth-card">
    <div class="kicker">Friendship KeyChain · private area</div>
    <h1>Admin Login</h1>
    <p>Masuk menggunakan akun admin toko yang sudah didaftarkan.</p>
    <div class="auth-message" id="authMessage" role="alert" aria-live="polite" hidden></div>
    <form id="adminLoginForm">
      <div class="field">
        <label for="adminEmail">Email</label>
        <input id="adminEmail" name="email" type="email" autocomplete="username" placeholder="admin@email.com" required />
      </div>
      <div class="field">
        <label for="adminPassword">Password</label>
        <input id="adminPassword" name="password" type="password" autocomplete="current-password" placeholder="Password admin" required />
      </div>
      <button class="btn" type="submit">Masuk</button>
    </form>
    <a class="back-link" href="index.html">← Kembali ke toko</a>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/admin-auth.js"></script>
</body>
</html>
