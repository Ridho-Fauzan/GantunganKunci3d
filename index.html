<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gantungan Kunci 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f3e9ff; }
  canvas { display: block; touch-action: none; }
  #panel {
    position: fixed; top: 16px; left: 16px; width: 260px;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
    border-radius: 16px; padding: 16px; box-shadow: 0 8px 30px rgba(80,40,120,0.18);
    color: #3a2a4d; font-size: 14px;
  }
  #panel h1 { font-size: 18px; margin: 0 0 12px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 13px; }
  input[type=text], select {
    width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid #d6c5ea; font-size: 14px; background: #fff;
  }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; box-shadow: 0 0 0 1px #ccc; }
  .swatch.active { box-shadow: 0 0 0 2px #7b3fe4; }
  input[type=color] { width: 30px; height: 30px; border: none; background: none; padding: 0; cursor: pointer; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1; padding: 9px 10px; border: none; border-radius: 10px; cursor: pointer;
    background: #7b3fe4; color: #fff; font-weight: 600; font-size: 13px;
  }
  button.secondary { background: #ece2fb; color: #5a2db0; }
  button:disabled { opacity: .6; cursor: wait; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-weight: 500; }
  #hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #6b5a80; background: rgba(255,255,255,.7); padding: 6px 12px; border-radius: 20px; }
  #toggle { display: none; }
  @media (max-width: 600px) {
    #panel { width: calc(100% - 24px); left: 12px; top: auto; bottom: 12px; max-height: 50vh; overflow: auto; }
    #hint { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="panel">
  <h1>🔑 Gantungan Kunci 3D</h1>

  <label for="nameInput">Tulisan</label>
  <input id="nameInput" type="text" maxlength="12" value="KIRO" />

  <label for="shapeSelect">Bentuk</label>
  <select id="shapeSelect">
    <option value="heart">❤️ Hati</option>
    <option value="star">⭐ Bintang</option>
    <option value="tag">🏷️ Tag</option>
    <option value="circle">⚪ Bulat</option>
  </select>

  <label for="finishSelect">Material</label>
  <select id="finishSelect">
    <option value="glossy">Akrilik Glossy</option>
    <option value="clear">Akrilik Bening</option>
    <option value="metal">Metalik</option>
    <option value="matte">Doff (Matte)</option>
  </select>

  <label>Warna</label>
  <div class="swatches" id="swatches">
    <input type="color" id="colorPicker" value="#ff4f8b" title="Pilih warna" />
  </div>

  <div class="check"><input type="checkbox" id="autoSwing" checked /><label for="autoSwing" style="margin:0;font-weight:500">Goyang otomatis</label></div>

  <div class="row">
    <button id="swingBtn">Goyangkan!</button>
    <button id="recordBtn" class="secondary">🎥 Rekam 6 dtk</button>
  </div>
</div>
<div id="hint">Drag untuk memutar kamera • Scroll untuk zoom • Klik gantungan untuk menggoyangkan</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

// ---------- Renderer / Scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#f3e9ff');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(1.5, 0.3, 9.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.2, 0);
controls.enableDamping = true;
controls.minDistance = 4;
controls.maxDistance = 16;
controls.update();

// Lights
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9c6f0, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 5, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5;
sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -5;
sun.shadow.radius = 6;
sun.shadow.bias = -0.0005;
scene.add(sun);

// Wall behind
const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 30),
  new THREE.MeshStandardMaterial({ color: '#efe3fb', roughness: 0.95 })
);
wall.position.z = -1.3;
wall.receiveShadow = true;
scene.add(wall);

// ---------- Materials ----------
const chromeMat = new THREE.MeshStandardMaterial({ color: 0xe8e8ee, metalness: 1, roughness: 0.18 });
const pegMat = new THREE.MeshStandardMaterial({ color: 0xc9a46a, metalness: 0.9, roughness: 0.3 });
const charmMat = new THREE.MeshPhysicalMaterial({ color: '#ff4f8b' });
const textMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.3, clearcoat: 1 });

function applyFinish(finish) {
  Object.assign(charmMat, {
    metalness: 0, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.05,
    transmission: 0, thickness: 0, ior: 1.5, transparent: false, opacity: 1
  });
  textMat.metalness = 0; textMat.roughness = 0.3; textMat.color.set(0xffffff);
  if (finish === 'clear') {
    charmMat.transmission = 0.92; charmMat.thickness = 0.6; charmMat.roughness = 0.05;
  } else if (finish === 'metal') {
    charmMat.metalness = 1; charmMat.roughness = 0.22; charmMat.clearcoat = 0;
    textMat.metalness = 1; textMat.roughness = 0.15; textMat.color.set(0xf1f1f5);
  } else if (finish === 'matte') {
    charmMat.roughness = 0.85; charmMat.clearcoat = 0;
  }
  charmMat.needsUpdate = true; textMat.needsUpdate = true;
}

// ---------- Build keychain hierarchy ----------
// Peg (paku) in wall
const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.8, 24), pegMat);
peg.rotation.x = Math.PI / 2;
peg.position.set(0, 2.6, -0.4);
peg.castShadow = true;
scene.add(peg);
const pegCap = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 16), pegMat);
pegCap.position.set(0, 2.6, 0.5);
pegCap.castShadow = true;
scene.add(pegCap);

const root = new THREE.Group();
root.position.set(0, 2.6, 0);
scene.add(root);

function addShadow(o) { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; }

// Split ring (double coil)
const R = 0.75, TUBE = 0.055;
const ringGroup = new THREE.Group(); // joint 0
root.add(ringGroup);
const ringGeo = new THREE.TorusGeometry(R, TUBE, 24, 120);
const ringCenterY = 0.07 + TUBE - R;
for (const dz of [-0.055, 0.055]) {
  const r = new THREE.Mesh(ringGeo, chromeMat);
  r.position.set(0, ringCenterY, dz);
  ringGroup.add(addShadow(r));
}

// Chain links (joints 1..N)
const N_LINKS = 4, PITCH = 0.38;
const linkGeo = new THREE.TorusGeometry(0.16, 0.042, 16, 48);
const joints = [ringGroup];
let parent = ringGroup;
let jointY = ringCenterY - R;
for (let i = 0; i < N_LINKS; i++) {
  const j = new THREE.Group();
  j.position.y = jointY;
  parent.add(j);
  const link = new THREE.Mesh(linkGeo, chromeMat);
  link.scale.set(1, 1.6, 1);
  link.position.y = -PITCH / 2;
  if (i % 2 === 0) link.rotation.y = Math.PI / 2; // alternate orientation
  j.add(addShadow(link));
  joints.push(j);
  parent = j;
  jointY = -PITCH;
}

// Jump ring + charm pivot (last joint)
const charmJoint = new THREE.Group();
charmJoint.position.y = -PITCH - 0.02;
parent.add(charmJoint);
joints.push(charmJoint);
const jumpRing = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.036, 16, 48), chromeMat);
jumpRing.rotation.y = Math.PI / 2;
jumpRing.position.y = -0.13;
charmJoint.add(addShadow(jumpRing));

const charmTwist = new THREE.Group(); // rotates around Y (spinning charm)
charmTwist.position.y = -0.28;
charmJoint.add(charmTwist);

// ---------- Charm shapes ----------
function heartShape() {
  const s = new THREE.Shape(), k = 0.075, n = 160;
  for (let i = 0; i <= n; i++) {
    const t = (i / n) * Math.PI * 2;
    const x = 16 * Math.sin(t) ** 3 * k;
    const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * k;
    i === 0 ? s.moveTo(x, y) : s.lineTo(x, y);
  }
  return { shape: s, holeY: 0.12, holeR: 0.13, textY: -0.45, maxW: 1.35, maxH: 0.42 };
}
function starShape() {
  const s = new THREE.Shape(), outer = 1.35, inner = 0.62;
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? inner : outer;
    const a = Math.PI / 2 + (i * Math.PI) / 5;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i === 0 ? s.moveTo(x, y) : s.lineTo(x, y);
  }
  s.closePath();
  return { shape: s, holeY: 0.82, holeR: 0.12, textY: -0.08, maxW: 0.95, maxH: 0.32 };
}
function tagShape() {
  const s = new THREE.Shape(), w = 1.4, h = 2.2, r = 0.38, x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return { shape: s, holeY: 0.78, holeR: 0.15, textY: -0.2, maxW: 1.1, maxH: 0.42 };
}
function circleShape() {
  const s = new THREE.Shape();
  s.absarc(0, 0, 1.05, 0, Math.PI * 2, false);
  return { shape: s, holeY: 0.78, holeR: 0.13, textY: -0.12, maxW: 1.45, maxH: 0.45 };
}
const SHAPES = { heart: heartShape, star: starShape, tag: tagShape, circle: circleShape };

const DEPTH = 0.22, BEVEL_T = 0.06;
let charmGroup = null;
let font = null;
const state = { shape: 'heart', text: 'KIRO' };

function disposeGroup(g) {
  g.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
}

function buildCharm() {
  if (charmGroup) { charmTwist.remove(charmGroup); disposeGroup(charmGroup); }
  const def = SHAPES[state.shape]();
  const hole = new THREE.Path();
  hole.absarc(0, def.holeY, def.holeR, 0, Math.PI * 2, true);
  def.shape.holes.push(hole);

  const geo = new THREE.ExtrudeGeometry(def.shape, {
    depth: DEPTH, bevelEnabled: true, bevelThickness: BEVEL_T, bevelSize: 0.05,
    bevelSegments: 6, curveSegments: 64
  });
  geo.translate(0, 0, -DEPTH / 2);
  geo.computeVertexNormals();

  charmGroup = new THREE.Group();
  const body = new THREE.Mesh(geo, charmMat);
  charmGroup.add(body);

  // Engraved / raised text on both sides
  const txt = state.text.trim();
  if (font && txt) {
    const tg = new TextGeometry(txt, {
      font, size: 0.4, height: 0.04, depth: 0.04, curveSegments: 8,
      bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.008, bevelSegments: 2
    });
    tg.computeBoundingBox();
    const bb = tg.boundingBox;
    const w = bb.max.x - bb.min.x, h = bb.max.y - bb.min.y;
    const sc = Math.min(def.maxW / w, def.maxH / h, 1.2);
    tg.translate(-(bb.min.x + w / 2), -(bb.min.y + h / 2), 0);
    const zFront = DEPTH / 2 + BEVEL_T - 0.01;
    for (const side of [1, -1]) {
      const t = new THREE.Mesh(tg, textMat);
      t.scale.setScalar(sc);
      t.position.set(0, def.textY, side * zFront);
      if (side < 0) t.rotation.y = Math.PI;
      charmGroup.add(t);
    }
  }
  // Hang so the hole sits on the jump ring
  charmGroup.position.y = -def.holeY;
  charmTwist.add(addShadow(charmGroup));
}

new FontLoader().load(
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
  f => { font = f; buildCharm(); },
  undefined,
  () => console.warn('Font gagal dimuat, tulisan tidak ditampilkan')
);
buildCharm();

// ---------- Simple chained-pendulum physics ----------
const J = joints.length;
const swing = {
  wz: new Float32Array(J), vz: new Float32Array(J), // swing left/right (world angle)
  wx: new Float32Array(J), vx: new Float32Array(J), // swing front/back
  twist: 0, vt: 0
};

function impulse(strength = 1) {
  const dir = Math.random() < 0.5 ? -1 : 1;
  swing.vz[0] += dir * (0.9 + Math.random() * 0.5) * strength;
  swing.vx[0] += (Math.random() - 0.5) * 0.8 * strength;
  swing.vt += (Math.random() < 0.5 ? -1 : 1) * (2.5 + Math.random() * 2.5) * strength;
}

function stepPhysics(dt, time, auto) {
  const { wz, vz, wx, vx } = swing;
  // Root (ring around peg): gravity pendulum, low damping
  let az = -14 * wz[0] - 0.7 * vz[0];
  let ax = -18 * wx[0] - 1.5 * vx[0];
  if (auto) {
    az += Math.sin(time * 1.1) * 0.45 + Math.sin(time * 2.7) * 0.15;
    ax += Math.sin(time * 0.8 + 1) * 0.2;
  }
  vz[0] += az * dt; wz[0] += vz[0] * dt;
  vx[0] += ax * dt; wx[0] += vx[0] * dt;
  wz[0] = THREE.MathUtils.clamp(wz[0], -0.9, 0.9);
  wx[0] = THREE.MathUtils.clamp(wx[0], -0.4, 0.4);

  // Each link lags slightly behind its parent (gives a soft whip/delay effect)
  for (let i = 1; i < J; i++) {
    const k = 140 - i * 10, c = 9.0;
    const a1 = -k * (wz[i] - wz[i - 1]) - c * (vz[i] - vz[i - 1]) - 3 * wz[i];
    const a2 = -k * (wx[i] - wx[i - 1]) - c * (vx[i] - vx[i - 1]) - 3 * wx[i];
    vz[i] += a1 * dt; wz[i] += vz[i] * dt;
    vx[i] += a2 * dt; wx[i] += vx[i] * dt;
  }

  // Charm twist (spins around the jump ring)
  let at = -3 * swing.twist - 0.5 * swing.vt + vz[J - 1] * 0.8;
  if (auto) at += Math.sin(time * 0.6) * 0.5;
  swing.vt += at * dt; swing.twist += swing.vt * dt;
}

function applyPhysics() {
  const { wz, wx } = swing;
  for (let i = 0; i < J; i++) {
    const pz = i ? wz[i - 1] : 0, px = i ? wx[i - 1] : 0;
    joints[i].rotation.z = wz[i] - pz;
    joints[i].rotation.x = wx[i] - px;
  }
  charmTwist.rotation.y = swing.twist;
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
const PRESETS = ['#ff4f8b', '#ff8a3d', '#ffd23f', '#3ddc97', '#3fa7ff', '#7b3fe4', '#222233'];
const swatches = $('swatches');
function setColor(hex) {
  charmMat.color.set(hex);
  $('colorPicker').value = hex;
  swatches.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.c === hex));
}
PRESETS.forEach(c => {
  const d = document.createElement('div');
  d.className = 'swatch'; d.style.background = c; d.dataset.c = c;
  d.onclick = () => setColor(c);
  swatches.insertBefore(d, $('colorPicker'));
});
$('colorPicker').oninput = e => setColor(e.target.value);
$('nameInput').oninput = e => { state.text = e.target.value; buildCharm(); };
$('shapeSelect').onchange = e => { state.shape = e.target.value; buildCharm(); impulse(0.6); };
$('finishSelect').onchange = e => applyFinish(e.target.value);
$('swingBtn').onclick = () => impulse(1);
setColor(PRESETS[0]);
applyFinish('glossy');

// Click (not drag) on the keychain -> swing it
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null;
renderer.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]);
  downPos = null;
  if (moved > 5) return;
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  if (raycaster.intersectObject(root, true).length) impulse(1.2);
});

// Record 6 seconds of video (WebM)
$('recordBtn').onclick = () => {
  if (!window.MediaRecorder) { alert('Browser ini tidak mendukung perekaman video.'); return; }
  const btn = $('recordBtn');
  const stream = renderer.domElement.captureStream(60);
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(m => MediaRecorder.isTypeSupported(m)) || '';
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 8e6 } : undefined);
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'gantungan-kunci.webm'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    btn.disabled = false; btn.textContent = '🎥 Rekam 6 dtk';
  };
  btn.disabled = true; btn.textContent = '⏺ Merekam...';
  impulse(1);
  rec.start();
  setTimeout(() => rec.stop(), 6000);
};

// ---------- Loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let time = 0;
setTimeout(() => impulse(1), 400);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  const sub = 4;
  for (let i = 0; i < sub; i++) {
    time += dt / sub;
    stepPhysics(dt / sub, time, $('autoSwing').checked);
  }
  applyPhysics();
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
